services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # env var THẮNG env_file trong pydantic-settings → trỏ host "db" trong network compose
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/nexus_ai
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # urlopen ném HTTPError trên 503 → exit ≠ 0 → unhealthy
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: nexus_ai
    ports:
      - "127.0.0.1:5432:5432"   # chỉ expose local — an toàn hơn 0.0.0.0
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

volumes:
  pgdata:
